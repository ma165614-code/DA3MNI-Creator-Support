<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دَعمني | DA3MNI</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5fb;--card:#fff;--ink:#17142e;--mut:#6b6885;--line:#e6e2f0;--pri:#e8386d;--pri2:#ff7a59;--soft:#fde8ee;--ok:#12a36b;--warn:#d98a00;--bad:#d7263d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110f22;--card:#1b1833;--ink:#f3f1fb;--mut:#a8a4c4;--line:#2d2950;--soft:#3a1a2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110f22;--card:#1b1833;--ink:#f3f1fb;--mut:#a8a4c4;--line:#2d2950;--soft:#3a1a2b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.7 Tajawal,Tahoma,"Segoe UI",sans-serif;min-height:100%}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top>div{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:11px;width:34px;height:34px;display:grid;place-items:center}
.links{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}.links a{padding:6px 12px;border-radius:99px;color:var(--mut);white-space:nowrap;font-size:15px}.links a:hover,.links a.on{background:var(--soft);color:var(--pri)}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px}
.btn{border:0;border-radius:14px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;box-shadow:0 8px 20px -8px var(--pri)}.btn.big{width:100%;padding:16px;font-size:19px}.btn.s{padding:6px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 18px -12px rgba(30,20,80,.25)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
h1{font-size:clamp(30px,6vw,52px);line-height:1.25;margin:0 0 10px;font-weight:800}h2{font-size:24px;margin:28px 0 12px}h3{margin:0 0 8px}
.mut{color:var(--mut)}.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex:none}.av.xl{width:92px;height:92px;font-size:38px}
.hero{padding:34px 0 10px;display:grid;gap:24px;grid-template-columns:1.1fr .9fr;align-items:center}@media(max-width:760px){.hero{grid-template-columns:1fr}.side{display:none!important}}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.amts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.amt{padding:14px;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}.amt.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.tag{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--pri)}.tag.ok{background:#12a36b22;color:var(--ok)}.tag.w{background:#d98a0022;color:var(--warn)}.tag.b{background:#d7263d22;color:var(--bad)}
.dl{display:grid;grid-template-columns:200px 1fr;gap:18px}@media(max-width:800px){.dl{grid-template-columns:1fr}.nav{flex-direction:row!important;overflow-x:auto}}
.nav{display:flex;flex-direction:column;gap:4px;align-self:start}.nav a{padding:10px 14px;border-radius:12px;color:var(--mut);white-space:nowrap}.nav a.on,.nav a:hover{background:var(--soft);color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tw{overflow-x:auto}
.stat b{display:block;font-size:26px}.pm{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:8px}.pm.on{border-color:var(--pri);background:var(--soft)}
.empty{text-align:center;padding:36px;color:var(--mut)}.err{background:#d7263d22;color:var(--bad);padding:10px 14px;border-radius:12px;margin:10px 0}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:380px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:9;display:none}
.spin{width:18px;height:18px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
pre{background:var(--bg);padding:14px;border-radius:12px;overflow-x:auto;direction:ltr;font-size:12px;line-height:1.5;margin:0}
.foot{border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--mut);font-size:14px}.foot a{margin:0 10px}
</style>
</head>
<body>
<header class="top"><div><a href="#home" class="logo"><i>❤</i>دَعمني</a><nav class="links" id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<footer class="foot"><a href="#terms">الشروط</a><a href="#terms">الخصوصية</a><a href="#terms">الدعم</a><a href="#admin">دخول الإدارة (تجريبي)</a><div>© DA3MNI — بيانات العرض تجريبية، لا توجد عمليات دفع حقيقية</div></footer>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('en-US')+' د.ع',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#e8386d','#6a4cff','#0ea5a4','#f59e0b','#2563eb','#c026d3','#16a34a','#ea580c'];
// ---- Settings (editable from Admin → settings; never hard-coded in logic)
const CFG={commission:8,gatewayFee:2.5,minAmt:1000,maxAmt:5000000,currency:'IQD',T:{heroTitle:'ادعم صانع المحتوى الذي تحبه ❤️',heroSub:'أرسل دعمك ورسالتك خلال ثوانٍ.'}};
// ---- Demo data
const CR=[['mohammed','محمد Gaming','Gaming','YouTube',1240,1,'ألعاب تنافسية وبث مباشر كل ليلة.',2500000,1860000],['sara','سارة كوميدي','Comedy','TikTok',860,1,'مقاطع ساخرة عن الحياة اليومية.',1000000,420000],['ali','علي بيت','Music','YouTube',540,1,'عزف وأغانٍ عراقية بنكهة جديدة.',1500000,700000],['zahra','زهراء لايف','Live','TikTok',410,0,'بثوث يومية وأحاديث خفيفة.',800000,150000],['hassan','حسن تك','Tech','YouTube',330,1,'مراجعات هواتف وشروحات بسيطة.',2000000,1250000],['noor','نور آرت','Art','Instagram',290,0,'رسم رقمي وتصميم شخصيات.',600000,310000]].map((c,i)=>({u:c[0],n:c[1],cat:c[2],plat:c[3],sup:c[4],ver:c[5],bio:c[6],goal:c[7],raised:c[8],col:COL[i]}));
const NAMES=['أحمد','مريم','كرار','دعاء','يوسف','هبة','مصطفى','رنا'],MSG=['استمر يا أسطورة!','محتواك يستاهل','شكرًا على الضحكة 😂','أنت الأفضل','واصل الإبداع'];
const DON=Array.from({length:12},(_,i)=>({id:'TX'+(9100+i),from:NAMES[i%8],to:CR[i%6],amt:[1000,2500,5000,10000,2500,5000][i%6],msg:MSG[i%5],m:['wallet','card','cash'][i%3],st:i==4?'قيد المعالجة':i==9?'فاشلة':'ناجحة',d:'2026-10-'+String(24-(i>>1)).padStart(2,'0')}));
const WD=[{id:'W-31',c:CR[0],a:500000,st:'قيد المراجعة'},{id:'W-30',c:CR[4],a:300000,st:'مقبول'},{id:'W-29',c:CR[2],a:150000,st:'مكتمل'},{id:'W-28',c:CR[3],a:90000,st:'مرفوض'}];
// ---- Payment Service: independent layer. Replace `adapter` with a real gateway client (token-based; never handle raw card data here).
const PaymentService={methods:[{id:'wallet',n:'محفظة إلكترونية',i:'📱'},{id:'card',n:'بطاقة عبر البوابة (Tokenized)',i:'💳'},{id:'cash',n:'وكيل / دفع نقدي',i:'🏪'}],
 quote(a){a=Math.min(CFG.maxAmt,Math.max(CFG.minAmt,Math.floor(+a||0)));const fee=Math.ceil(a*CFG.gatewayFee/100),cut=Math.round(a*CFG.commission/100);return{amount:a,fee,total:a+fee,commission:cut,creatorNet:a-cut}},
 adapter:{async charge(q){await new Promise(r=>setTimeout(r,1000));return{ok:true,ref:'DEMO-'+Date.now().toString(36)}}},
 async pay(q,method){if(q.amount<CFG.minAmt)throw Error('أقل مبلغ للدعم '+fmt(CFG.minAmt));return this.adapter.charge({...q,method})}};
const S={amt:5000,msg:'',anon:false,name:'',method:'wallet',cat:'الكل',q:'',busy:false,error:'',last:null,ob:1,obd:{type:'Gaming',name:'',user:'',goal:1000000},notes:['مرحبًا بك في دَعمني 👋','تم توثيق رقم هاتفك'],sound:'بوب',dur:6,minAlert:5000,wdAmt:100000,loading:false};
const cr=u=>CR.find(c=>c.u===u),av=(c,x='')=>`<div class="av ${x}" style="background:${c.col}">${esc(c.n[0])}</div>`,tick=c=>c.ver?' <span title="موثق" style="color:#2563eb">✓</span>':'';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const bars=(v,l)=>{const m=Math.max(...v);return`<div style="display:flex;align-items:flex-end;gap:8px;height:140px">${v.map((x,i)=>`<div style="flex:1;text-align:center;font-size:12px"><div style="height:${x/m*100}px;background:linear-gradient(var(--pri),var(--pri2));border-radius:8px 8px 3px 3px" title="${x}"></div>${l[i]}</div>`).join('')}</div>`};
const st=s=>`<span class="tag ${/ناجحة|مكتمل|مقبول|موثق/.test(s)?'ok':/مراجعة|معالجة/.test(s)?'w':/فاشلة|مرفوض|موقوف/.test(s)?'b':''}">${s}</span>`;
const supCard=d=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${esc(d.from)}</b> <span class="mut">— ${esc(d.msg)}</span></span><b style="color:var(--pri)">${fmt(d.amt)}</b></div>`;
function dnav(a,items){return`<div class="nav card" style="padding:10px">${items.map(([h,t])=>`<a href="#${h}" class="${a===h?'on':''}">${t}</a>`).join('')}</div>`}
const CD=[['dash','🏠 الرئيسية'],['earn','💰 الأرباح'],['stats','📊 الإحصائيات'],['link','🔗 الرابط وQR'],['alerts','🔔 التنبيهات'],['withdraw','🏦 السحب'],['verify','🛡️ التحقق'],['settings','⚙️ الإعدادات']];
const AD=[['admin','نظرة عامة'],['admin-creators','المبدعون'],['admin-donations','التبرعات'],['admin-withdrawals','السحوبات'],['admin-risk','مركز المخاطر'],['admin-settings','الإعدادات والنصوص'],['schema','قاعدة البيانات']];
const me=CR[0];
const P={
home:()=>`<section class="hero"><div><span class="tag">دعم سريع بدون حساب</span><h1 style="margin-top:12px">${esc(CFG.T.heroTitle)}</h1><p class="mut" style="font-size:19px">${esc(CFG.T.heroSub)}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn p" href="#discover">ابدأ الدعم</a><a class="btn" href="#onboard">أنا صانع محتوى</a></div></div>
<div class="card side" style="background:linear-gradient(150deg,var(--pri),#6a4cff);color:#fff;border:0"><div class="mut" style="color:#ffe">🔥 تنبيه مباشر</div><h3 style="font-size:24px">محمد دعمك بـ 10,000 د.ع</h3><p>استمر يا أسطورة!</p><div class="bar" style="background:#fff3"><b style="width:74%;background:#fff"></b></div></div></section>
<h2>المبدعون الأكثر دعمًا</h2><div class="grid g3">${[...CR].sort((a,b)=>b.sup-a.sup).slice(0,3).map(cc).join('')}</div>
<h2>كيف تعمل المنصة؟</h2><div class="grid g3">${[['1','افتح رابط المبدع','من TikTok أو YouTube'],['2','اختر المبلغ واكتب رسالتك','بدون إنشاء حساب'],['3','أكّد الدفع','يصل الدعم فورًا مع تنبيه']].map(x=>`<div class="card"><div class="tag">${x[0]}</div><h3 style="margin-top:8px">${x[1]}</h3><span class="mut">${x[2]}</span></div>`).join('')}</div>
<h2>لماذا دَعمني؟</h2><div class="grid g4">${[['⚡','سريع','أقل عدد خطوات'],['🔒','آمن','لا نخزن بيانات البطاقات'],['🇮🇶','بالدينار','جاهز لعملات ودول أخرى'],['🔔','تنبيهات','لبثوث الستريمرز']].map(x=>`<div class="card"><div style="font-size:30px">${x[0]}</div><b>${x[1]}</b><div class="mut">${x[2]}</div></div>`).join('')}</div>`,
terms:()=>`<div class="card"><h1 style="font-size:30px">الشروط والخصوصية والدعم</h1><p class="mut">نص تجريبي قابل للتعديل من لوحة الإدارة. لا نخزن بيانات البطاقات، ويُعالج الدفع عبر مزود مرخّص.</p></div>`,
discover:()=>{const cats=['الكل','Gaming','Comedy','Music','Live','Tech','Art','TikTok','YouTube'];const L=CR.filter(c=>(S.cat==='الكل'||c.cat===S.cat||c.plat===S.cat)&&(c.n+c.u).toLowerCase().includes(S.q.toLowerCase()));
return`<h1 style="font-size:34px">اكتشف المبدعين</h1><input id="q" placeholder="🔍 ابحث بالاسم أو Username" value="${esc(S.q)}" oninput="S.q=this.value;list()"><div style="display:flex;gap:8px;overflow-x:auto;padding:12px 0">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid g3" id="lst">${listH(L)}</div>`},
creator:u=>{const c=cr(u);if(!c)return`<div class="card empty">😕 لم نجد هذا المبدع.<br><a class="btn p" href="#discover" style="margin-top:12px">اكتشف المبدعين</a></div>`;const q=PaymentService.quote(S.amt);
return`<div class="grid g2" style="align-items:start"><div class="card"><div style="display:flex;gap:14px;align-items:center">${av(c,'xl')}<div><h1 style="font-size:28px;margin:0">${esc(c.n)}${tick(c)}</h1><span class="mut">@${c.u} · ${c.cat}</span></div></div><p>${esc(c.bio)}</p><div class="row"><button class="btn s" onclick="navigator.clipboard&&navigator.clipboard.writeText('da3mni.com/${c.u}');toast('تم نسخ الرابط')">🔗 مشاركة</button><span class="mut">👥 ${c.sup} داعم</span></div>
<h3 style="margin-top:18px">الهدف</h3><div class="row mut"><span>${fmt(c.raised)}</span><span>${fmt(c.goal)}</span></div><div class="bar"><b style="width:${c.raised/c.goal*100}%"></b></div>
<h3 style="margin-top:18px">آخر الداعمين</h3>${DON.filter(d=>d.to===c&&d.st==='ناجحة').slice(0,4).map(supCard).join('')||'<div class="empty">كن أول الداعمين 💛</div>'}
<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag">▶ ${c.plat}</span><span class="tag">🎵 TikTok</span><span class="tag">📷 Instagram</span></div></div>
<div class="card"><h3>اختر مبلغ الدعم</h3><div class="amts">${[1000,2500,5000,10000].map(a=>`<button class="amt ${S.amt===a?'on':''}" onclick="S.amt=${a};render()">${a.toLocaleString('en-US')} د.ع</button>`).join('')}</div>
<label>مبلغ آخر</label><input type="number" inputmode="numeric" min="${CFG.minAmt}" value="${S.amt}" oninput="S.amt=+this.value;upd()">
<label>رسالتك (اختياري)</label><textarea rows="3" maxlength="200" placeholder="اكتب كلمة حلوة..." oninput="S.msg=this.value">${esc(S.msg)}</textarea>
<label>اسمك</label><input value="${esc(S.name)}" placeholder="الاسم الذي سيظهر" oninput="S.name=this.value" ${S.anon?'disabled':''}>
<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" ${S.anon?'checked':''} onchange="S.anon=this.checked;render()">تبرع كمجهول</label>
<a class="btn p big" style="margin-top:14px" href="#pay-${c.u}">❤️ ادعم الآن</a></div></div>`},
pay:u=>{const c=cr(u)||CR[0],q=PaymentService.quote(S.amt);return`<div style="max-width:520px;margin:auto" class="card"><h1 style="font-size:26px">إتمام الدعم</h1>
<div class="row"><span class="mut">إلى</span><b>${esc(c.n)}</b></div><div class="row"><span class="mut">الرسالة</span><span>${esc(S.msg||'—')}</span></div>
<h3 style="margin-top:16px">طريقة الدفع</h3>${PaymentService.methods.map(m=>`<div class="pm ${S.method===m.id?'on':''}" onclick="S.method='${m.id}';render()">${m.i} <b>${m.n}</b></div>`).join('')}
<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><div class="row"><span class="mut">مبلغ الدعم</span><b>${fmt(q.amount)}</b></div><div class="row"><span class="mut">رسوم الدفع (${CFG.gatewayFee}%)</span><b>${fmt(q.fee)}</b></div><div class="row" style="font-size:20px"><b>الإجمالي</b><b style="color:var(--pri)">${fmt(q.total)}</b></div></div>
${S.error?`<div class="err">⚠️ ${esc(S.error)}</div>`:''}<button class="btn p big" style="margin-top:14px" ${S.busy?'disabled':''} onclick="doPay('${c.u}')">${S.busy?'<span class="spin"></span> جارٍ المعالجة':'تأكيد الدفع 🔒'}</button><p class="mut" style="font-size:13px;text-align:center">عملية تجريبية — لا يُسحب أي مبلغ فعلي</p></div>`},
success:()=>{const l=S.last;if(!l)return`<div class="card empty">لا توجد عملية حديثة.<br><a class="btn p" href="#discover">ادعم مبدعًا</a></div>`;return`<div class="card" style="max-width:480px;margin:auto;text-align:center"><div class="pop" style="font-size:64px">🎉</div><h1 style="font-size:28px">تم إرسال دعمك! ❤️</h1><h2 style="color:var(--pri);margin:6px">${fmt(l.q.amount)}</h2><p>إلى <b>${esc(l.c.n)}</b></p><p class="mut">«${esc(l.msg||'بدون رسالة')}»</p><div style="display:grid;gap:8px"><button class="btn p" onclick="navigator.clipboard&&navigator.clipboard.writeText('da3mni.com/${l.c.u}');toast('تم نسخ رابط المبدع')">مشاركة الدعم</button><a class="btn" href="#creator-${l.c.u}">ادعم مرة أخرى</a><a class="btn" href="#home">العودة للصفحة الرئيسية</a></div></div>`},
login:()=>`<div class="card" style="max-width:440px;margin:auto"><h1 style="font-size:26px">إنشاء حساب / دخول</h1><p class="mut">الحساب اختياري — يمكنك دعم أي مبدع بدون تسجيل.</p><label>الاسم</label><input><label>البريد الإلكتروني</label><input type="email" dir="ltr"><label>رقم الهاتف</label><input type="tel" dir="ltr" placeholder="07xx xxx xxxx"><label>كلمة المرور</label><input type="password" minlength="8"><button class="btn p big" style="margin-top:14px" onclick="toast('تجريبي: التسجيل الفعلي يحتاج خادمًا');go('dash')">متابعة</button></div>`,
onboard:()=>{const o=S.obd,s=S.ob,T=['نوع المحتوى','الاسم والرابط','الصورة والروابط','الهدف المالي','السحب والتحقق'];
const b=[`<div class="grid g3">${['Gaming','Comedy','Music','Live','Tech','Art'].map(t=>`<div class="pm ${o.type===t?'on':''}" onclick="S.obd.type='${t}';render()">${t}</div>`).join('')}</div>`,`<label>الاسم</label><input value="${esc(o.name)}" oninput="S.obd.name=this.value"><label>Username</label><input dir="ltr" value="${esc(o.user)}" oninput="S.obd.user=this.value.replace(/[^a-z0-9_]/gi,'').toLowerCase();this.value=S.obd.user">`,`<label>نبذة</label><textarea rows="3"></textarea><label>YouTube</label><input dir="ltr" placeholder="youtube.com/@"><label>TikTok</label><input dir="ltr" placeholder="tiktok.com/@">`,`<label>الهدف (د.ع) — اختياري</label><input type="number" value="${o.goal}" oninput="S.obd.goal=+this.value">`,`<label>طريقة السحب</label><select><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select><label>رقم المحفظة / الحساب</label><input dir="ltr"><label>إثبات الهوية (عند الحاجة)</label><input type="file">`][s-1];
return`<div class="card" style="max-width:560px;margin:auto"><div class="bar"><b style="width:${s*20}%"></b></div><p class="mut">الخطوة ${s} من 5 — ${T[s-1]}</p>${b}<div class="row" style="margin-top:16px">${s>1?'<button class="btn" onclick="S.ob--;render()">السابق</button>':'<span></span>'}${s<5?'<button class="btn p" onclick="S.ob++;render()">التالي</button>':'<button class="btn p" onclick="S.ob=1;toast(\'🎉 رابطك: da3mni.com/\'+(S.obd.user||\'username\'));go(\'dash\')">إنهاء</button>'}</div></div>`},
dash:()=>cdash('dash',`<div class="grid g4">${[['الرصيد الحالي',fmt(1240000)],['أرباح الشهر',fmt(860000)],['إجمالي الدعم',fmt(me.raised)],['عدد الداعمين',me.sup]].map(x=>`<div class="card stat"><span class="mut">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="row"><h3>آخر العمليات</h3><a class="btn p s" href="#withdraw">طلب السحب</a></div>${DON.filter(d=>d.to===me).concat(DON.slice(0,3)).slice(0,5).map(supCard).join('')}</div>`),
earn:()=>cdash('earn',`<div class="grid g4">${[['إجمالي الأرباح',fmt(1860000)],['المتاح للسحب',fmt(1240000)],['قيد المعالجة',fmt(120000)],['أرباح الشهر',fmt(860000)],['الشهر السابق',fmt(640000)]].map(x=>`<div class="card stat"><span class="mut">${x[0]}</span><b style="font-size:21px">${x[1]}</b></div>`).join('')}</div><div class="card tw" style="margin-top:14px"><h3>سجل العمليات</h3><table><tr><th>الرقم<th>الداعم<th>المبلغ<th>صافي بعد العمولة<th>التاريخ</tr>${DON.slice(0,6).map(d=>`<tr><td>${d.id}<td>${d.from}<td>${fmt(d.amt)}<td>${fmt(PaymentService.quote(d.amt).creatorNet)}<td>${d.d}</tr>`).join('')}</table></div>`),
stats:()=>cdash('stats',`<div class="grid g4">${[['زيارات الصفحة','8,420'],['الداعمون','1,240'],['إجمالي التبرعات',fmt(1860000)],['متوسط التبرع',fmt(4800)],['معدل التحويل','14.7%']].map(x=>`<div class="card stat"><span class="mut">${x[0]}</span><b style="font-size:21px">${x[1]}</b></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>أفضل الأيام</h3>${bars([40,55,48,70,95,120,88],['س','ح','ن','ث','ر','خ','ج'])}</div><div class="card"><h3>مصادر الزيارات</h3>${[['TikTok',48],['YouTube',32],['Instagram',12],['مباشر',8]].map(x=>`<div style="margin:10px 0"><div class="row"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="bar"><b style="width:${x[1]}%"></b></div></div>`).join('')}</div></div>`),
link:()=>cdash('link',`<div class="card"><h3>رابط الدعم الخاص بك</h3><div class="row"><input readonly dir="ltr" value="da3mni.com/${me.u}"><button class="btn p" onclick="navigator.clipboard&&navigator.clipboard.writeText('da3mni.com/${me.u}');toast('تم نسخ الرابط')">نسخ</button></div><div class="grid g2" style="margin-top:16px"><div style="text-align:center">${qr()}<div class="mut" style="font-size:13px">شكل توضيحي — يُولَّد QR حقيقي من الخادم لاحقًا</div></div><div>${['TikTok: ضع الرابط في Bio أو Link in bio','YouTube: ضعه في الوصف والتعليق المثبّت','Instagram: أضفه في رابط الملف الشخصي','Twitch: أضفه في لوحة About كأمر !support'].map(t=>`<p>✅ ${t}</p>`).join('')}</div></div></div>`),
alerts:()=>cdash('alerts',`<div class="grid g2"><div class="card"><h3>إعداد التنبيه</h3><label>رابط Alert Widget (OBS)</label><input readonly dir="ltr" value="da3mni.com/widget/${me.u}?k=demo-token"><label>الصوت</label><select onchange="S.sound=this.value"><option>بوب</option><option>جرس</option><option>ضحكة</option></select><label>مدة الظهور: ${S.dur} ثوانٍ</label><input type="range" min="3" max="15" value="${S.dur}" oninput="S.dur=+this.value;this.previousElementSibling.textContent='مدة الظهور: '+S.dur+' ثوانٍ'"><label>الحد الأدنى (د.ع)</label><input type="number" value="${S.minAlert}" oninput="S.minAlert=+this.value"><button class="btn p big" style="margin-top:12px" onclick="testAlert()">تجربة التنبيه</button></div><div class="card" style="background:#222;color:#fff;display:grid;place-items:center;min-height:220px"><div id="al" style="text-align:center"><div style="font-size:26px;font-weight:800">🔥 محمد دعمك بـ 10,000 د.ع</div><div>استمر يا أسطورة!</div><div class="mut" style="margin-top:8px">معاينة</div></div></div></div>`),
withdraw:()=>{const w=S.wdAmt,fee=Math.round(w*.01);return cdash('withdraw',`<div class="grid g2"><div class="card"><div class="row"><span class="mut">الرصيد المتاح</span><b>${fmt(1240000)}</b></div><label>المبلغ المطلوب</label><input type="number" value="${w}" oninput="S.wdAmt=+this.value"><label>طريقة السحب</label><select><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select><div class="row" style="margin-top:12px"><span class="mut">الرسوم (1%)</span><b>${fmt(fee)}</b></div><div class="row"><span class="mut">المتوقع استلامه</span><b style="color:var(--ok)">${fmt(w-fee)}</b></div><button class="btn p big" style="margin-top:12px" onclick="S.wdAmt>1240000||S.wdAmt<10000?toast('المبلغ غير صالح'):toast('تم إرسال الطلب — قيد المراجعة')">طلب السحب</button></div><div class="card"><h3>حالة الطلبات</h3>${WD.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${x.id} · ${fmt(x.a)}</span>${st(x.st)}</div>`).join('')}</div></div>`)},
verify:()=>cdash('verify',`<div class="card"><div class="row"><h3>حالة الحساب</h3>${st('موثق')}</div>${[['رقم الهاتف','موثق'],['البريد الإلكتروني','موثق'],['إثبات الهوية','قيد المراجعة'],['بيانات السحب','موثق']].map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${x[0]}</span>${st(x[1])}</div>`).join('')}<p class="mut">الحالات الممكنة: موثق / قيد المراجعة / موقوف</p></div>`),
settings:()=>cdash('settings',`<div class="card"><div class="grid g2"><div><label>الاسم</label><input value="${me.n}"><label>Username</label><input dir="ltr" value="${me.u}"><label>Bio</label><textarea rows="3">${me.bio}</textarea></div><div><label>البريد</label><input dir="ltr" value="m***@mail.com"><label>الهاتف</label><input dir="ltr" value="077•• ••• 123"><label>كلمة مرور جديدة</label><input type="password"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" checked>المصادقة الثنائية (2FA)</label></div></div><button class="btn p" style="margin-top:14px" onclick="toast('تم حفظ التغييرات')">حفظ التغييرات</button></div>`),
admin:()=>adm('admin',`<div class="grid g4">${[['إجمالي المبدعين',CR.length],['إجمالي التبرعات',fmt(9460000)],['عمولة المنصة (${CFG.commission}%)'.replace('${CFG.commission}',CFG.commission),fmt(756800)],['عمليات اليوم',34],['طلبات السحب',2],['قيد المراجعة',2]].map(x=>`<div class="card stat"><span class="mut">${x[0]}</span><b style="font-size:22px">${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>آخر 7 أيام</h3>${bars([30,44,38,60,52,81,34],['س','ح','ن','ث','ر','خ','ج'])}</div>`),
'admin-creators':()=>adm('admin-creators',`<div class="card tw"><input placeholder="🔍 بحث" style="margin-bottom:10px" oninput="[...document.querySelectorAll('#ct tr')].forEach(r=>r.style.display=r.textContent.includes(this.value)?'':'none')"><table><tbody id="ct">${CR.map(c=>`<tr><td><b>${c.n}</b> @${c.u}<td>${st(c.ver?'موثق':'قيد المراجعة')}<td><button class="btn s" onclick="toast('تم توثيق ${c.u}')">توثيق</button> <button class="btn s" onclick="toast('تم التعليق')">تعليق</button> <button class="btn s" onclick="toast('تم الحظر + سجل تدقيق')">حظر</button></tr>`).join('')}</tbody></table></div>`),
'admin-donations':()=>adm('admin-donations',`<div class="card tw"><table><tr><th>Transaction ID<th>المتبرع<th>Creator<th>المبلغ<th>الدفع<th>الحالة<th>التاريخ</tr>${DON.map(d=>`<tr><td dir="ltr">${d.id}<td>${d.from}<td>${d.to.n}<td>${fmt(d.amt)}<td>${d.m}<td>${st(d.st)}<td>${d.d}</tr>`).join('')}</table></div>`),
'admin-withdrawals':()=>adm('admin-withdrawals',`<div class="grid">${WD.map(x=>`<div class="card row"><div><b>${x.id} · ${x.c.n}</b><div class="mut">${fmt(x.a)} · ${x.c.ver?'موثق':'غير موثق'}</div></div>${x.st==='قيد المراجعة'?'<span><button class="btn p s" onclick="toast(\'تمت الموافقة\')">موافقة</button> <button class="btn s" onclick="toast(\'تم الرفض\')">رفض</button></span>':st(x.st)}</div>`).join('')}</div>`),
'admin-risk':()=>adm('admin-risk',`<div class="grid">${[['5 تبرعات خلال دقيقة من نفس الجهاز','zahra','مرتفع'],['مبلغ غير معتاد (×20 من المتوسط)','noor','متوسط'],['محاولات دفع فاشلة متكررة','عميل مجهول','مرتفع']].map(r=>`<div class="card row"><div><b>${r[0]}</b><div class="mut">${r[1]}</div></div><span>${st(r[2]==='مرتفع'?'فاشلة':'قيد المراجعة')} <button class="btn s" onclick="toast('تم التجميد للمراجعة اليدوية')">تجميد</button></span></div>`).join('')}</div><p class="mut">قواعد أولية (rules-based): تُحدَّد حدودها من الإعدادات وتُسجَّل في RiskEvents.</p>`),
'admin-settings':()=>adm('admin-settings',`<div class="card"><h3>العمولة والرسوم</h3><label>عمولة المنصة %</label><input type="number" step=".5" value="${CFG.commission}" oninput="CFG.commission=+this.value"><label>رسوم الدفع %</label><input type="number" step=".1" value="${CFG.gatewayFee}" oninput="CFG.gatewayFee=+this.value"><h3 style="margin-top:18px">النصوص</h3><label>عنوان الصفحة الرئيسية</label><input value="${esc(CFG.T.heroTitle)}" oninput="CFG.T.heroTitle=this.value"><label>الوصف</label><input value="${esc(CFG.T.heroSub)}" oninput="CFG.T.heroSub=this.value"><button class="btn p" style="margin-top:14px" onclick="toast('تم الحفظ — شاهدها في الرئيسية')">حفظ</button></div>`),
schema:()=>adm('schema',`<div class="card"><pre>Users(id, name, email, phone, password_hash, role[visitor|supporter|creator|admin], 2fa, created_at)
Creators(id, user_id, username UNIQUE, category, status[verified|pending|suspended], balance)
CreatorProfiles(creator_id, avatar, bio, socials JSON, goal_amount, goal_raised)
Donations(id, creator_id, supporter_id NULL, display_name, is_anonymous, message, amount_minor, currency, status)
Transactions(id, donation_id, gateway_ref, method_id, fee_minor, commission_minor, net_minor, status, idempotency_key UNIQUE)
PaymentMethods(id, code, country, currency, enabled, config_ref)
Withdrawals(id, creator_id, amount_minor, fee_minor, method, status[pending|approved|rejected|paid], reviewed_by)
Verification(id, creator_id, type[phone|email|id|payout], status, doc_ref)
Alerts(id, creator_id, token_hash, sound, duration, min_amount)
Notifications(id, user_id, text, read_at)
Reports(id, reporter, target, reason, status)
RiskEvents(id, subject_type, subject_id, rule, score, action[flag|freeze], created_at)
Admins(id, user_id, permissions JSON)
AuditLogs(id, admin_id, action, target, before, after, created_at)
Settings(key, value JSON)  -- commission, fees, limits, UI texts</pre></div>`)};
function cdash(a,body){return`<div class="dl">${dnav(a,CD)}<div>${body}</div></div>`}
function adm(a,body){return`<div class="dl">${dnav(a,AD)}<div><div class="card" style="margin-bottom:14px;background:var(--soft)">🔐 لوحة الإدارة — صلاحية Admin فقط (في الإنتاج: جلسة آمنة + 2FA + Audit Logs)</div>${body}</div></div>`}
function cc(c){return`<a class="card" href="#creator-${c.u}" style="display:block"><div style="display:flex;gap:12px;align-items:center">${av(c)}<div><b>${esc(c.n)}${tick(c)}</b><div class="mut" style="font-size:14px">@${c.u} · ${c.cat}</div></div></div><div class="row" style="margin-top:12px"><span class="mut">👥 ${c.sup}</span><span class="btn p s">ادعم الآن</span></div></a>`}
function listH(L){return L.length?L.map(cc).join(''):'<div class="card empty" style="grid-column:1/-1">🔍 لا نتائج مطابقة. جرّب اسمًا آخر أو تصنيفًا مختلفًا.</div>'}
function list(){const L=CR.filter(c=>(S.cat==='الكل'||c.cat===S.cat||c.plat===S.cat)&&(c.n+c.u).toLowerCase().includes(S.q.toLowerCase()));$('#lst').innerHTML=listH(L)}
function upd(){/* keep focus while typing amount: only refresh chips */document.querySelectorAll('.amt').forEach(b=>b.classList.toggle('on',parseInt(b.textContent.replace(/,/g,''))===S.amt))}
function qr(){let s='',h=7;for(let y=0;y<17;y++)for(let x=0;x<17;x++){h=(h*1103515245+12345)&0x7fffffff;const f=(x<5&&y<5)||(x>11&&y<5)||(x<5&&y>11);if(f?(x%4==0||y%4==0||x%12==0||y%12==0||(x%12==2&&y%12==2)||(x%12==2&&y%12==2)):(h>>8)%2)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg viewBox="-1 -1 19 19" width="160" height="160" style="background:#fff;border-radius:12px;padding:4px"><g fill="#17142e">${s}</g></svg>`}
function testAlert(){const e=$('#al');e.innerHTML='<div class="pop" style="font-size:26px;font-weight:800">🔥 محمد دعمك بـ 10,000 د.ع</div><div>استمر يا أسطورة!</div>';toast('🔊 '+S.sound+' — '+S.dur+' ثوانٍ')}
async function doPay(u){if(S.busy)return;const q=PaymentService.quote(S.amt);S.busy=true;S.error='';render();try{const r=await PaymentService.pay(q,S.method);S.last={c:cr(u),q,msg:S.msg,ref:r.ref};S.notes.unshift('تم إرسال دعمك بنجاح');S.busy=false;go('success')}catch(e){S.busy=false;S.error=e.message||'تعذّر إتمام الدفع، حاول مرة أخرى.';render()}}
function go(h){location.hash=h}
function render(){const h=(location.hash||'#home').slice(1),[k,...r]=h.split('-');let key=h,arg=null;if(/^(creator|pay)-/.test(h)){key=k;arg=r.join('-')}
const f=P[key];$('#app').innerHTML=f?f(arg):'<div class="card empty">😕 الصفحة غير موجودة.<br><a class="btn p" href="#home">الرئيسية</a></div>';
const pri=[['home','الرئيسية'],['discover','اكتشف'],['onboard','للمبدعين'],['dash','لوحتي'],['login','دخول']];
$('#nav').innerHTML=pri.map(([a,t])=>`<a href="#${a}" class="${key===a?'on':''}">${t}</a>`).join('')+`<a href="#home" onclick="toast(S.notes[0])">🔔 ${S.notes.length}</a>`;}
addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script>
